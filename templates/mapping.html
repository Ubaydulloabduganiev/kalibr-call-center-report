{% extends "base.html" %}{% block content %}<h1>Call data mapping</h1><p>Use <a href="/admin/discovery">Discovery</a> to find your task types, pipeline stages and note types.</p><form method="post" class="mapping"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Event source<select name="event_source"><option value="hybrid" {% if mapping.event_source=='hybrid' %}selected{% endif %}>Tasks + notes</option><option value="tasks" {% if mapping.event_source=='tasks' %}selected{% endif %}>Completed tasks</option><option value="notes" {% if mapping.event_source=='notes' %}selected{% endif %}>Notes</option></select></label><label>Call task type IDs<input name="task_type_ids" value="{{ mapping.task_type_ids|join(',') }}"></label><label>Call note types<input name="note_types" value="{{ mapping.note_types|join(',') }}"></label><label>Success stage IDs<input name="success_status_ids" value="{{ mapping.success_status_ids|join(',') }}"></label><label>Failure stage IDs<input name="failure_status_ids" value="{{ mapping.failure_status_ids|join(',') }}"></label><label>In-progress stage IDs<input name="in_progress_status_ids" value="{{ mapping.in_progress_status_ids|join(',') }}"></label><label>Success text patterns<textarea name="success_patterns">{{ mapping.success_patterns|join('\n') }}</textarea></label><label>Failure text patterns<textarea name="failure_patterns">{{ mapping.failure_patterns|join('\n') }}</textarea></label><label>In-progress text patterns<textarea name="in_progress_patterns">{{ mapping.in_progress_patterns|join('\n') }}</textarea></label><label>Minimum duration, seconds<input type="number" min="0" name="minimum_duration_seconds" value="{{ mapping.minimum_duration_seconds }}"></label><p>Keep minimum duration at 0 when amoCRM does not store duration.</p><button class="primary">Save mapping</button></form>{% endblock %}
